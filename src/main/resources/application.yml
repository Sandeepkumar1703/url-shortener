spring:

  # ============================================================
  # Application Configuration
  # ============================================================
  application:
    name: url-shortener

  # ============================================================
  # PostgreSQL Database Configuration
  # Environment variables are used in Docker.
  # Defaults are used for local development.
  # ============================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Postgres@123}
    driver-class-name: org.postgresql.Driver

  # ============================================================
  # JPA / Hibernate Configuration
  # ============================================================
  jpa:
    hibernate:
      # Flyway manages the schema, so Hibernate only validates it.
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  # ============================================================
  # Flyway Database Migration
  # Automatically executes migration scripts during application
  # startup.
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ============================================================
  # Jackson JSON Configuration
  # Exclude null fields from API responses.
  # ============================================================
  jackson:
    default-property-inclusion: non_null

  # ============================================================
  # Redis Configuration
  #
  # Local Development:
  #   REDIS_HOST defaults to localhost
  #
  # Docker:
  #   REDIS_HOST is supplied as "redis"
  # ============================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

      # Optional connection timeout
      timeout: 2000ms

  # ============================================================
  # Spring Cache Configuration
  #
  # Redis will be used as the cache provider.
  # ============================================================
  cache:
    type: redis

    redis:

      # Default cache expiration time
      time-to-live: 10m

      # Prevent caching null values
      cache-null-values: false

      # Cache key prefix
      use-key-prefix: true

# ============================================================
# SpringDoc OpenAPI / Swagger Configuration
# ============================================================
springdoc:

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /v3/api-docs

# ============================================================
# Embedded Tomcat Configuration
# ============================================================
server:
  port: 8080

# ============================================================
# Logging Configuration
# ============================================================
logging:

  level:
    root: INFO
    com.sandeep.urlshortener: DEBUG

    # Uncomment while debugging Redis
    # org.springframework.data.redis: DEBUG
    # io.lettuce.core: DEBUG